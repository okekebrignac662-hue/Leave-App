<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Calendar card -->
  <g filter="url(#shadow)">
    <rect x="100" y="110" width="312" height="300" rx="36" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="3" stroke-opacity="0.4"/>
    
    <!-- Top header bar of calendar -->
    <path d="M 100 146 Q 100 110 136 110 L 376 110 Q 412 110 412 146 L 412 185 L 100 185 Z" fill="#ffffff" fill-opacity="0.25"/>
    
    <!-- Calendar rings -->
    <rect x="170" y="85" width="22" height="52" rx="11" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="320" y="85" width="22" height="52" rx="11" fill="#ffffff" fill-opacity="0.9"/>

    <!-- Calendar grid items -->
    <rect x="135" y="215" width="48" height="42" rx="10" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="200" y="215" width="48" height="42" rx="10" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="265" y="215" width="48" height="42" rx="10" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="330" y="215" width="48" height="42" rx="10" fill="#ffffff" fill-opacity="0.2"/>
    
    <rect x="135" y="275" width="48" height="42" rx="10" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="200" y="275" width="48" height="42" rx="10" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="265" y="275" width="48" height="42" rx="10" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="330" y="275" width="48" height="42" rx="10" fill="#ffffff" fill-opacity="0.2"/>

    <rect x="135" y="335" width="48" height="42" rx="10" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="200" y="335" width="48" height="42" rx="10" fill="#ffffff" fill-opacity="0.2"/>
  </g>

  <!-- Palm leaf / Time-off branch motif -->
  <g stroke="#a7f3d0" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M 230 380 Q 255 270 330 180" stroke="#6ee7b7" stroke-width="6"/>
    <path d="M 260 330 Q 300 320 335 340"/>
    <path d="M 270 300 Q 315 285 345 300"/>
    <path d="M 285 265 Q 330 245 355 255"/>
    <path d="M 305 225 Q 345 195 365 210"/>
    <path d="M 245 345 Q 210 340 190 355"/>
    <path d="M 255 315 Q 220 305 200 315"/>
    <path d="M 270 280 Q 235 265 215 275"/>
    <path d="M 290 240 Q 255 220 235 230"/>
  </g>

  <!-- Approved / Success circular badge -->
  <circle cx="365" cy="355" r="62" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="4" filter="url(#shadow)"/>
  <path d="M 342 355 L 358 371 L 390 339" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
